spring.datasource.url=jdbc:h2:mem:agrofarm;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false
agrofarm.auth.token-ttl-hours=1
agrofarm.auth.max-failed-attempts=5
agrofarm.auth.lock-minutes=5
agrofarm.seed.enabled=true
