server.port=${PORT:8090}

# --- PostgreSQL ---------------------------------------------------------
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:Agro_Farm}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:1234}
spring.datasource.driver-class-name=org.postgresql.Driver

# Схему создаёт скрипт database/agrofarm.sql; если таблиц нет, сервер выполнит его сам при запуске
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# --- Прочее -------------------------------------------------------------
spring.jackson.serialization.write-dates-as-timestamps=false
# Срок жизни токена авторизации, часов
agrofarm.auth.token-ttl-hours=12
# Защита от подбора пароля: число неудачных попыток и время блокировки, минут
agrofarm.auth.max-failed-attempts=5
agrofarm.auth.lock-minutes=5
# Наполнять пустую базу демонстрационными данными при запуске
agrofarm.seed.enabled=true
